# Cloudflare Pages config for irfanshakeel.com.
# The existing Astro site stays a static build (dist/). The /ctf challenge adds
# Pages Functions (functions/) backed by D1.
#
# PRODUCTION and PREVIEW use SEPARATE databases:
#   production (main branch)       -> nmt-ctf          (live event data)
#   preview (every other branch)   -> nmt-ctf-preview  (testing only)
name = "irfanblog"
pages_build_output_dir = "./dist"
compatibility_date = "2026-05-29"

[[d1_databases]]
binding = "CTF_DB"
database_name = "nmt-ctf"
database_id = "95e6bf94-c3e2-43eb-9846-1831b030da95"
migrations_dir = "migrations"

[env.production]
[[env.production.d1_databases]]
binding = "CTF_DB"
database_name = "nmt-ctf"
database_id = "95e6bf94-c3e2-43eb-9846-1831b030da95"
migrations_dir = "migrations"

[env.preview]
[[env.preview.d1_databases]]
binding = "CTF_DB"
database_name = "nmt-ctf-preview"
database_id = "9067f755-9a5d-4cb0-8e02-6f0a6dcfcf83"
migrations_dir = "migrations"

# Secrets (Pages env vars of type secret_text, per environment; never committed):
#   CTF_ADMIN_PASSWORD, CTF_SESSION_SECRET, CTF_ANSWER_KEY,
#   CTF_FLAG_IDENTITY, CTF_FLAG_BLIND, CTF_FLAG_CAPABLE, CTF_FLAG_OBJECTIVE, CTF_FLAG_BOUNDARY
